name: Build + Test

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: set up go
        uses: actions/setup-go@v4
        with:
          go-version-file: "./go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8

      - name: build it!
        run: make build

      - name: run unit tests
        run: go test -v ./cmd

      - name: install bats
        run: sudo apt install bats

      - name: run bats tests
        run: bats ./tests/bats_test.sh
